name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Lint and test
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          task tools:install
          task lint
          task test
